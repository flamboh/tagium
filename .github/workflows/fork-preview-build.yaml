name: Fork preview build

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: fork-preview-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    name: Build fork preview
    if: github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: .node-version
          cache: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"

      - run: vp install
      - run: bun run build:cloudflare
        env:
          GITHUB_SHA: ${{ github.event.pull_request.head.sha }}

      - name: Record pull request
        run: echo "${{ github.event.pull_request.number }}" > .output/pr-number

      - uses: actions/upload-artifact@v4
        with:
          name: fork-preview
          path: .output
          include-hidden-files: true
          retention-days: 3
