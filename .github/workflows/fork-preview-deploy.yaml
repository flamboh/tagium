name: Fork preview deploy

on:
  workflow_run:
    workflows: [Fork preview build]
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  deploy:
    name: Deploy fork preview
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name != github.repository
    runs-on: ubuntu-latest
    environment: preview
    concurrency:
      group: fork-preview-deploy-${{ github.event.workflow_run.head_sha }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: .node-version
          cache: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"

      - run: vp install

      - uses: actions/download-artifact@v4
        with:
          name: fork-preview
          path: .output
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Verify pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          pr="$(cat .output/pr-number)"
          [[ "$pr" =~ ^[0-9]+$ ]] || { echo "invalid pr number"; exit 1; }
          test "$(gh pr view "$pr" --repo "$GITHUB_REPOSITORY" --json headRefOid -q .headRefOid)" = "$HEAD_SHA"
          echo "number=$pr" >> "$GITHUB_OUTPUT"

      - name: Upload preview version
        id: upload
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PR: ${{ steps.pr.outputs.number }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -o pipefail
          bun run deploy:preview --preview-alias "pr-$PR" --tag "${HEAD_SHA:0:7}" --message "fork pr #$PR" | tee upload.log
          echo "alias_url=$(grep -oE 'Preview Alias URL: https://\S+' upload.log | cut -d' ' -f4)" >> "$GITHUB_OUTPUT"
          echo "version_url=$(grep -oE 'Version Preview URL: https://\S+' upload.log | cut -d' ' -f4)" >> "$GITHUB_OUTPUT"

      - name: Comment preview url
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.pr.outputs.number }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          ALIAS_URL: ${{ steps.upload.outputs.alias_url }}
          VERSION_URL: ${{ steps.upload.outputs.version_url }}
        run: |
          marker="<!-- fork-preview -->"
          body="$(printf '%s\n**fork preview** for %s\n\n- branch: %s\n- commit: %s\n' "$marker" "${HEAD_SHA:0:7}" "$ALIAS_URL" "$VERSION_URL")"
          comment_id="$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            -q "[.[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\")))][0].id // empty" | head -n1)"
          if [ -n "$comment_id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" -f body="$body"
          else
            gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "$body"
          fi
