name: Preview

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: read

concurrency:
  group: alchemy-preview-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  STAGE: pr-${{ github.event.pull_request.number }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
  FLY_ORG: ${{ vars.FLY_ORG }}

jobs:
  deploy:
    name: Deploy preview
    if: >-
      vars.ALCHEMY_PREVIEWS == 'true' &&
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "24"
          cache: true

      - run: vp install

      - name: Log in to the fly registry
        run: echo "$FLY_API_TOKEN" | docker login registry.fly.io --username x --password-stdin

      - name: Deploy
        run: bun run alchemy:deploy --stage "$STAGE" --yes

      - name: Report preview url
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          url="$(bun x alchemy state read "tagium/$STAGE/output" --log-level error \
            | grep -oE 'https://[a-z0-9.-]+\.workers\.dev' | head -n 1)"
          if [ -z "$url" ]; then
            echo "::error::could not read the preview url for $STAGE"
            exit 1
          fi
          echo "preview for $STAGE: $url" >> "$GITHUB_STEP_SUMMARY"
          gh pr comment "$PR_NUMBER" --edit-last --create-if-none \
            --body "preview \`$STAGE\` for ${HEAD_SHA:0:7}: $url"

  destroy:
    name: Destroy preview
    if: >-
      vars.ALCHEMY_PREVIEWS == 'true' &&
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "24"
          cache: true

      - run: vp install

      - name: Destroy
        run: bun run alchemy:destroy --stage "$STAGE" --yes
