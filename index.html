<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (() => {
        try {
          const storedTheme = localStorage.getItem("tagium:theme");
          const theme =
            storedTheme === "light" || storedTheme === "dark"
              ? storedTheme
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";

          document.documentElement.classList.toggle("dark", theme === "dark");
          document.documentElement.dataset.theme = theme;
        } catch {
          document.documentElement.classList.add("dark");
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Satoshi is imported from the Fontshare CDN in src/index.css. A <link rel=stylesheet>
         here does not survive the Vite build, so the import lives in CSS instead. -->
    <link rel="preconnect" href="https://api.fontshare.com" />
    <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin />
    <title>tagium</title>
    <meta
      name="description"
      content="tagium is the best way to save your favorite music and edit mp3 tags all on the web."
    />
    <meta property="og:title" content="tagium" />
    <meta
      property="og:description"
      content="save your favorite music and edit mp3 tags all on the web."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://tagium.app/" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="tagium" />
    <meta
      name="twitter:description"
      content="save your favorite music and edit mp3 tags all on the web."
    />
    <link rel="canonical" href="https://tagium.app/" />
    <meta name="theme-color" content="#900f1a" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="alternate icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <script>
      (() => {
        const faviconByDeployEnv = {
          local: "/favicon-dev.svg",
          preview: "/favicon-preview.svg",
          production: "/favicon.svg",
        };
        const favicon = document.querySelector('link[rel="icon"]');
        const setDeployEnvFavicon = (deployEnv) => {
          if (favicon && Object.hasOwn(faviconByDeployEnv, deployEnv)) {
            favicon.href = faviconByDeployEnv[deployEnv];
          }
        };
        const normalizedHostname = window.location.hostname.toLowerCase();
        const isLocalDev =
          normalizedHostname === "localhost" ||
          normalizedHostname === "127.0.0.1" ||
          normalizedHostname === "0.0.0.0" ||
          normalizedHostname === "::1" ||
          normalizedHostname.endsWith(".local");

        if (isLocalDev) {
          setDeployEnvFavicon("local");
        }

        fetch("/api/dev/config", { headers: { Accept: "application/json" } })
          .then((response) => (response.ok ? response.json() : null))
          .then((config) => {
            if (config?.deployEnv) {
              setDeployEnvFavicon(config.deployEnv);
            }
          })
          .catch(() => {});
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
